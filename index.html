<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>養序</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--card2:#1a1a1d;--ink:#f1ede6;--mut:#8d8a84;--pri:#d4b483;--pri2:rgba(212,180,131,.12);--on:#14110c;--warn:#ff7a7a;--warn2:rgba(255,122,122,.12);--line:#27272b;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(900px 400px at 85% -10%,rgba(212,180,131,.08),transparent 60%)}
h1,h3,small{font-size:inherit}
button{font:inherit;cursor:pointer}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header h1{font-weight:700;margin:0;flex:1;min-width:120px;color:var(--pri);display:flex;align-items:center;gap:8px}
header select{font:inherit;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--ink);max-width:140px;width:auto}
#sync{background:transparent;border-radius:20px;padding:5px 12px;border:1px solid var(--line);color:var(--mut)}
nav{background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 8px}
@media(min-width:760px){nav{grid-template-columns:repeat(9,1fr)}}
nav button{border:0;background:none;padding:8px 2px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ink);border-color:var(--pri)}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input[type=search],.bar input[type=date]{flex:1;min-width:130px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#5f5d59}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
input[readonly]{background:#101012;color:var(--mut)}
.btn{border:1px solid var(--pri);border-radius:10px;padding:9px 16px;background:var(--pri);color:var(--on);font-weight:700}
.btn.sec{background:transparent;color:var(--pri);border-color:rgba(212,180,131,.4)}
.btn.warn{background:transparent;color:var(--warn);border-color:rgba(255,122,122,.35)}
.btn.sm{padding:5px 11px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.chip.pc{--c:#9aa0a6}
.chip.pc.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);color:var(--ink)}
.chip small{opacity:.7;margin-left:2px;font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters .chip{padding:4px 11px}
.chip.sm{padding:3px 11px}
.dh{margin:18px 2px 8px;font-weight:700;color:var(--pri)}
.card{background:var(--card);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;border:1px solid var(--line)}
.card-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card-h b{margin-right:auto}
.tag{background:#222226;border-radius:20px;padding:2px 10px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:16px;height:16px;vertical-align:middle}
.tag.part{font-weight:700}
.tag.sv{background:transparent;border:1px solid;font-weight:700}
.kvs{display:flex;flex-wrap:wrap;gap:6px 16px}
.en{color:inherit;font-weight:400;font-size:12px;margin-left:6px}
.blks{margin-top:6px}
.blk{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.blk>i{flex:none;max-width:55%}
.blk>.bt{flex:1;min-width:0}
.blk:first-child{border-top:0}
.blk>i{font-style:normal;color:var(--pri);font-weight:700}
.bt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.kvs+.blks{margin-top:8px}
.kv i{font-style:normal;color:var(--mut);margin-right:5px}
.kv.bad{color:var(--warn);font-weight:600}
.note{color:var(--mut);margin-top:4px;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:44px 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid>*{min-width:0}
.eyes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.eyef{display:flex;align-items:center;gap:8px}.eyef b{color:var(--pri);flex:none}
.tag.eye{font-weight:700}
input[type=date],input[type=time]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;display:block;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
@media(max-width:420px){.grid{grid-template-columns:minmax(0,1fr)}.items{grid-template-columns:minmax(0,1fr)}}
.fld label{display:block;color:var(--mut);margin-bottom:4px}
.fld label small{color:var(--pri)}
.full{grid-column:1/-1}
.gh{font-weight:700;color:var(--pri);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.sx .sn{font-weight:700;min-width:5.5em}
.so{display:flex;gap:6px;flex-wrap:wrap}
.lbl{color:var(--mut);min-width:4.5em;align-self:center}
.opt{--c:#d4b483;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:700}
.opt.on{background:color-mix(in srgb,var(--c) 25%,transparent);border-color:var(--c);color:var(--c)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--pri);font-weight:700}
.sh button{border:0;background:none;color:var(--mut)}
.mbody{overflow:auto;padding:16px 18px;flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
details.grp>summary{padding:11px 13px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cnt{margin-left:auto;font-weight:400;color:var(--mut)}
details.grp[open]>summary{border-bottom:1px solid var(--line);background:var(--pri2);border-radius:12px 12px 0 0}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:12px}
.it{display:flex;flex-direction:column}
.it label{color:var(--mut)}
.it .row{display:flex;gap:4px}
.flag{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:0 9px;color:#6a6862;font-weight:700;white-space:nowrap}
.flag.on{background:var(--warn2);border-color:var(--warn);color:var(--warn)}
.it.bad input{border-color:var(--warn);background:var(--warn2)}
.it.hide{display:none}
.it .wi{display:none;vertical-align:middle;margin-left:4px}.it.bad .wi{display:inline-flex}
.it .sd{color:var(--mut);font-weight:400;margin-left:4px}
.ckl{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:1px 10px;padding:7px 0;border-top:1px solid var(--line)}
.ckl .n{display:inline-flex;align-items:center;gap:5px}.ckl .v{font-weight:700;color:var(--pri)}.ckl .rf{flex-basis:100%;color:var(--mut)}
.ckl.tx{flex-direction:column;align-items:stretch;gap:3px}.ckl.tx .v{font-weight:400;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.ckl.tx.bad .v{color:#ff6b6b}
.tbl td.tt{white-space:pre-line;min-width:150px;max-width:260px;overflow-wrap:anywhere;vertical-align:top}
.ckl.bad{background:rgba(255,107,107,.1);margin:0 -8px;padding:7px 8px;border-radius:8px}.ckl.bad .n,.ckl.bad .v{color:#ff6b6b}
.ckbad{margin:8px 0;border:1px solid rgba(255,107,107,.45);border-radius:10px;padding:2px 10px}.ckbad .ckl:first-child{border-top:0}
.ckg{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.ckg .sm0{display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:700}.ckg summary{cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 0;font-weight:700}.ckg .cnt{margin-left:auto;color:var(--mut);font-weight:400}
.tbl td.bad{color:#ff6b6b}.tbl td .ic{vertical-align:middle;margin-right:3px}
.tbl{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.tbl th{background:#1d1b17;color:var(--pri);position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--card);font-weight:600}
.tbl th:first-child{background:#1d1b17}
.tbl td.bad{color:var(--warn);font-weight:700}
.tbl td.ck{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tbl td.ck .hl{padding:0 3px;margin:0 -3px;border-radius:3px;background-image:linear-gradient(transparent 50%,rgba(255,92,150,0) 50%);transition:background-image .2s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tbl td.ck:hover .hl,.tbl td.ck:active .hl,.tbl td.ck.sel .hl{background-image:linear-gradient(transparent 40%,rgba(255,92,150,.28) 40%,rgba(255,92,150,.28) 92%,transparent 92%)}
.tbl td.ck small{font-size:11px}
.tbl td.ck .hl{position:relative;z-index:0}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lgs{margin-top:6px}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;color:var(--mut)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tbl tr.gr td{background:#19181a;font-weight:700}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 4px;text-align:center;color:var(--ink);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa .ic{width:28px;height:28px}
.qa:active{background:var(--pri2)}
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;color:var(--pri)}
.stat small{color:var(--mut)}
h3{margin:20px 0 9px;font-weight:700;color:var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:var(--on);font-weight:600;padding:9px 20px;border-radius:30px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.97}
.pr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:6px}
.pr b{flex:1}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2e2e33;border-radius:8px}
@media(max-width:520px){.items,.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1 id="logo"></h1>
  <select id="who" aria-label="切換人員"></select>
  <button id="sync" data-act="sync"></button>
</header>
<nav id="nav"></nav>
<main class="wrap" id="main"></main>
<div class="modal" id="modal" hidden><div class="sheet"><div class="sh"><span id="mt"></span><button data-act="close" aria-label="關閉">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<div id="toast"></div>

<script>
/* ============ 基本工具 ============ */
const $=(s,r=document)=>r.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const TODAY=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const NOW=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['日','一','二','三','四','五','六'];
const wday=d=>{const t=new Date(d+'T00:00:00');return isNaN(t)?'':'(週'+WD[t.getDay()]+')'};
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)};

/* ============ 圖示(SVG,不會亂碼)與顏色 ============ */
const ICON={
warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5"/><circle cx="12" cy="18" r=".9" fill="currentColor"/>',
vessel:'<path d="M3 8c3-3 5 3 9 0s6 3 9 0"/><path d="M3 16c3-3 5 3 9 0s6 3 9 0"/>',
shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
gender:'<circle cx="9" cy="15" r="4"/><path d="M12 12l6-6M14 6h4v4"/><path d="M18 14v5M15.5 16.5h5"/>',
plan:'<path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.7 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/>',
leaf:'<path d="M5 19C5 9 10 5 20 5c0 9-4 14-12 14"/><path d="M5 19c3-5 6-8 10-10"/>',
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
vitals:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
diet:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',
meds:'<rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M9 9l6 6"/>',
symptoms:'<path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
visits:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
checkup:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/>',
settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
brain:'<path d="M12 4v16"/><path d="M12 6a3 3 0 0 0-6 1 3 3 0 0 0-2 4 3 3 0 0 0 2 4 3 3 0 0 0 6 2"/><path d="M12 6a3 3 0 0 1 6 1 3 3 0 0 1 2 4 3 3 0 0 1-2 4 3 3 0 0 1-6 2"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
ent:'<path d="M7 10a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 1"/><path d="M10 10a2 2 0 0 1 4 0"/>',
lungs:'<path d="M12 3v9"/><path d="M12 8C9 8 5 10 5 16c0 3 1 4 3 4s4-1 4-4"/><path d="M12 8c3 0 7 2 7 8 0 3-1 4-3 4s-4-1-4-4"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
stomach:'<path d="M9 3v4c0 3-5 3-5 9a5 5 0 0 0 5 5c6 0 11-3 11-9 0-4-4-4-5-7V3"/>',
liver:'<path d="M3 10c0-3 3-4 7-4h6c3 0 5 2 5 5 0 5-5 8-10 8-5 0-8-4-8-9z"/><path d="M13 10c1 2 3 3 5 3"/>',
kidney:'<path d="M9 3C5 3 3 7 3 11c0 5 3 10 7 10 2 0 3-1.5 3-3.5 0-2 2-2.5 2-5C15 7 12 3 9 3z"/><path d="M9 9c-1 1-1 3 0 4"/>',
bone:'<path d="M7 17L17 7"/><circle cx="5.5" cy="15.5" r="2.5"/><circle cx="8.5" cy="18.5" r="2.5"/><circle cx="15.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="8.5" r="2.5"/>',
limb:'<path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V6a1.5 1.5 0 0 1 3 0v8c0 4-2 7-6 7-3 0-5-2-6-5l-1-4a1.5 1.5 0 0 1 3-.5L8 13"/>',
skin:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="14.5" cy="9" r="1" fill="currentColor"/><circle cx="13" cy="14.5" r="1" fill="currentColor"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/>',
body:'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M7 11l5-2 5 2M9 21l3-6 3 6"/>',
other:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="16" cy="12" r="1.2" fill="currentColor"/>',
drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',
female:'<circle cx="12" cy="9" r="5"/><path d="M12 14v8M9 18h6"/>',
virus:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>'
};
const ICOL={vessel:'#ff8a5c',shield:'#7bd88f',gender:'#f78fb3',warn:'#ff6b6b',plan:'#e6c15a',leaf:'#d4b483',home:'#d4b483',vitals:'#ff6b81',diet:'#9be564',meds:'#4cc3ff',symptoms:'#ffb347',visits:'#5eead4',checkup:'#b78cff',settings:'#c9c9c9',
brain:'#b78cff',eye:'#4cc3ff',ent:'#ffb347',lungs:'#5eead4',heart:'#ff6b81',stomach:'#ffd166',liver:'#d9955f',kidney:'#5b9dff',bone:'#d6c7a1',limb:'#9be564',skin:'#ff9e7a',body:'#e8e2d6',other:'#9aa0a6',drop:'#ff4d6d',flask:'#f4a259',female:'#ff8fb8',virus:'#c084fc'};
const ic=(k,c,sz)=>`<svg class="ic" viewBox="0 0 24 24" style="color:${c||ICOL[k]||'currentColor'}${sz?`;width:${sz}px;height:${sz}px`:''}">${ICON[k]||''}</svg>`;
$('#logo').innerHTML=ic('leaf','#d4b483',24)+'養序';

/* ============ 症狀選單(可自行增減:部位 → 細項 → 症狀;順序是從頭到腳,最後是全身、其他) ============ */
const SEV=['輕微','中','嚴重'];                       /* 一般症狀的程度選項 */
const DEF_OPT={'鼻水':['微','中','多','濃'],'發燒':['低燒','中度','高燒'],'排便':['正常','偏硬','偏軟']};  /* 特別的症狀選項 */

const normPart=s=>String(s==null?'':s).replace(/\s*／\s*/g,' | ');
function defaultRows(){
  const R=[];
  for(const d in DEF_PARTS){
    const sub=DEF_PARTS[d].sub;
    for(const x in sub){
      if(!sub[x].length)R.push({'大項':d,'細項':x,'症狀':'','選項':''});
      sub[x].forEach(n=>{
        let sp='';
        if(n==='換牙'&&x==='口腔')sp='@換牙';
        else if(d==='四肢')sp='左右:左,右,雙側|程度:輕微,中,嚴重';
        else if(n==='月經')sp='狀態:開始,持續,結束|經量:少,中,多';
        else if(DEF_OPT[n])sp=DEF_OPT[n].join(',');
        R.push({'大項':d,'細項':x,'症狀':n,'選項':sp});
      });
    }
  }
  return R;
}
function parseSpec(sp){
  sp=String(sp||'').trim();
  if(!sp)return {t:'simple',o:SEV};
  if(sp==='@換牙')return {t:'tooth'};
  const split=x=>x.split(/[,，、]/).map(y=>y.trim()).filter(Boolean);
  if(/[:：]/.test(sp)){
    const lv=sp.split(/[|｜]/).map(seg=>{const i=seg.search(/[:：]/);return i<0?['選項',split(seg)]:[seg.slice(0,i).trim()||'選項',split(seg.slice(i+1))]}).filter(l=>l[1].length);
    return lv.length?{t:'deep',lv}:{t:'simple',o:SEV};
  }
  const o=split(sp);return {t:'simple',o:o.length?o:SEV};
}
function buildOptions(rows){
  const P={},SP={},BY={};let da='',xi='';
  rows.forEach(r=>{
    let d=normPart(String(r['大項']||'').trim()),x=String(r['細項']||'').trim(),n=String(r['症狀']||'').trim(),sp=String(r['選項']||'').trim();
    if(!d&&!x&&!n&&!sp)return;
    if(d){da=d;xi=x}else{d=da;if(x)xi=x;else x=xi}
    if(!d)return;
    if(!P[d])P[d]={i:DEF_PARTS[d]?DEF_PARTS[d].i:'other',sub:{}};
    if(x&&!P[d].sub[x])P[d].sub[x]=[];
    if(x&&n){
      if(!P[d].sub[x].includes(n))P[d].sub[x].push(n);
      const sc=parseSpec(sp);SP[d+'|'+x+'|'+n]=sc;
      if(sc.t==='simple'&&!BY[n])BY[n]=sc.o;
    }
  });
  return {P,SP,BY};
}

/* 把 Apps Script 網頁應用程式網址貼在下面的引號中(貼好就不用再到設定頁輸入) */
const SCRIPT_URL='';
let cfg=LS('hr_cfg',{url:'',token:'',person:''});
if(SCRIPT_URL)cfg.url=SCRIPT_URL;
let DB=LS('hr_db',{});let Q=LS('hr_q',[]);
let UI={tab:'home',f:{},cmp:false};
let lastErr='',flushing=false;
Object.values(SEC).forEach(s=>{DB[s.sheet]=DB[s.sheet]||[]});
applyOptions();
const persons=()=>(DB['人員']||[]).map(r=>r['姓名']).filter(Boolean);
const saveCfg=()=>SV('hr_cfg',cfg);
function putRow(sheet,o){const a=DB[sheet]=DB[sheet]||[];const i=a.findIndex(r=>r.id===o.id);if(i>=0)a[i]=o;else a.push(o);SV('hr_db',DB);enqueue({action:'upsert',sheet,row:o})}
function delRow(sheet,id){DB[sheet]=(DB[sheet]||[]).filter(r=>r.id!==id);SV('hr_db',DB);enqueue({action:'delete',sheet,id})}
function enqueue(op){
  Q=Q.filter(x=>!(x.sheet===op.sheet&&(x.row?x.row.id:x.id)===(op.row?op.row.id:op.id)&&x.action==='upsert'));
  Q.push(op);SV('hr_q',Q);flush();
}
async function api(method,payload){
  if(method==='GET'){const u=new URL(cfg.url);u.searchParams.set('action',payload.action);if(cfg.token)u.searchParams.set('token',cfg.token);const r=await fetch(u);return r.json()}
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token:cfg.token})});
  return r.json();
}
async function flush(){
  if(!cfg.url||flushing||!Q.length){badge();return}
  flushing=true;lastErr='';badge();
  const n=Q.length;
  try{const res=await api('POST',{action:'batch',ops:Q.slice(0,n)});if(!res.ok)throw new Error(res.error||'失敗');Q=Q.slice(n);SV('hr_q',Q)}
  catch(e){lastErr=e.message||'連線失敗'}
  flushing=false;badge();
  if(!lastErr&&Q.length)flush();
}
async function pull(silent,light){
  if(!cfg.url){if(!silent)toast('尚未設定 Google Sheet 網址');return false}
  await flush();
  if(Q.length){toast('還有資料待同步,請稍後再試');return false}
  try{
    if(!light){const i=await api('POST',{action:'init',headers:HEADERS()});if(!i.ok)throw new Error(i.error)}
    const r=await api('GET',{action:'all'});if(!r.ok)throw new Error(r.error);
    DB=r.data;Object.values(SEC).forEach(s=>{DB[s.sheet]=DB[s.sheet]||[]});
    if(!(DB['選項']||[]).length){try{const rows=defaultRows();const z=await api('POST',{action:'initOptions',rows:rows.map(x=>[x['大項'],x['細項'],x['症狀'],x['選項']])});if(z&&z.ok)DB['選項']=rows}catch(e){}}
    SV('hr_db',DB);applyOptions();
    if(!silent)toast('已從 Sheet 載入');
    const ae=document.activeElement;if(!light||($('#modal').hidden&&!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))))render();return true;
  }catch(e){lastErr=e.message;badge();if(!silent)toast('讀取失敗:'+e.message);return false}
}
function badge(){
  const b=$('#sync');
  if(!cfg.url)b.textContent='未連線';
  else if(flushing)b.textContent='同步中…';
  else if(lastErr)b.textContent='同步失敗(點此重試)';
  else if(Q.length)b.textContent='待同步 '+Q.length;
  else b.textContent='已同步';
}

function toolbar(key){

  if(key==='checkup'&&UI.cmp)return h+'<div id="list"></div>';
  h+=`<div class="bar"><input type="search" id="q" placeholder="搜尋任何文字(姓名、藥名、醫院、症狀…)" value="${esc(f.q||'')}"><input type="date" id="df" value="${esc(f.from||'')}" title="起"><input type="date" id="dt" value="${esc(f.to||'')}" title="迄"></div>`;
  if(s.hasPart)h+='<div class="filters" id="pf"></div>';

}
function baseRows(key){
  const s=SEC[key];return (DB[s.sheet]||[]).filter(r=>!cfg.person||r['姓名']===cfg.person);
}
function drawList(key){
  const s=SEC[key],f=UI.f[key]=UI.f[key]||{},dk=dkOf(s),L=$('#list');
  if(key==='checkup'&&UI.cmp){drawCompare();return}
  let a=baseRows(key);
  if(f.q){const q=f.q.toLowerCase();a=a.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q))}
  if(f.from)a=a.filter(r=>(r[dk]||'')>=f.from);
  if(f.to)a=a.filter(r=>(r[dk]||'')<=f.to);
  if(s.hasPart){
    const cnt={};a.forEach(r=>{const p=r['症狀部位大項']||'';cnt[p]=(cnt[p]||0)+1});
    $('#pf').innerHTML=`<button class="chip ${!f.part?'on':''}" data-act="part" data-p="">全部 <small>${a.length}</small></button>`+Object.keys(PARTS).map(p=>`<button class="chip pc ${f.part===p?'on':''}" style="--c:${pcol(p)}" data-act="part" data-p="${esc(p)}">${picon(p,18)}${p}${cnt[p]?` <small>${cnt[p]}</small>`:''}</button>`).join('');
    if(f.part)a=a.filter(r=>r['症狀部位大項']===f.part);
  }
  a.sort((x,y)=>((y[dk]||'')+(y['時間']||'')).localeCompare((x[dk]||'')+(x['時間']||'')));
  const cb=$('#chartbox');if(cb)cb.innerHTML=chartHTML(key,a);
  if(!a.length){L.innerHTML='<div class="empty">還沒有資料<br>按上方「＋ 新增」開始記錄</div>';return}
  let h='',last='';

      h+=`<div class="fld full"><label>症狀部位:先選大項,再選細項</label><div class="chips" id="pp"></div><div class="chips" id="pd" style="margin-top:8px"></div><input type="hidden" name="症狀部位大項" value="${esc(val('症狀部位大項'))}"><input type="hidden" name="症狀部位細項" value="${esc(splitSub(val('症狀部位大項'),val('症狀部位細項'))[0])}"><div id="pxw" style="margin-top:8px"><div id="pxe" hidden><label style="display:block;color:var(--mut);margin-bottom:4px">眼睛度數 <small style="color:var(--pri)">選填,例如 右 0、左 50</small></label><div class="eyes"><div class="eyef"><b>右</b><input type="text" id="pxr" placeholder="0" value="${esc((eyeParse(splitSub(val('症狀部位大項'),val('症狀部位細項'))[1])||['',''])[0])}"></div><div class="eyef"><b>左</b><input type="text" id="pxl" placeholder="50" value="${esc((eyeParse(splitSub(val('症狀部位大項'),val('症狀部位細項'))[1])||['',''])[1])}"></div></div></div><div id="pxo"><label style="display:block;color:var(--mut);margin-bottom:4px">細項補充 <small style="color:var(--pri)">選填</small></label><input type="text" id="px" placeholder="補充說明,例如 左邊、位置" value="${esc(splitSub(val('症狀部位大項'),val('症狀部位細項'))[1])}"></div></div></div>`;continue}
    if(f.t==='chips'){
      h+=`<div class="fld full"><label>症狀與程度(點選程度即勾選,再點一次取消)</label><div id="syms"></div></div>`;continue}
    let v=val(f.k);
    if(f.t==='time'&&f.k==='時間'&&mode!=='edit')v=NOW();
    if(key==='vitals'&&fresh&&f.k==='身高')v=latestOf('身體數值',person,'身高');
    const full=f.t==='area'||f.full?'full':'';
    if(f.t==='area'){h+=`<div class="fld full"><label>${L2(f.k)}</label><textarea name="${f.k}" rows="2">${esc(v)}</textarea></div>`;continue}
    if(f.t==='sel'){h+=`<div class="fld"><label>${L2(f.k)}${f.req?' <small>必填,分析用</small>':''}</label><select name="${f.k}" ${f.req?'required':''}>${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select></div>`;continue}
    const type=f.t==='time'?'time':f.t==='date'?'date':f.t==='text'?'text':'number';
    h+=`<div class="fld ${full}"><label>${L2(f.k)}${f.req?' <small>必填,分析用</small>':''}${f.u?` <small>${f.u}</small>`:''}${f.auto?' <small>自動計算</small>':''}</label><input type="${type}" name="${f.k}" value="${esc(v)}" ${f.req?'required':''} ${type==='number'?`step="${f.step||'any'}" inputmode="decimal"`:''} ${f.auto?'readonly':''}>${f.water?'<div class="chips" style="margin-top:6px">'+[150,250,500,1000].map(n=>`<button type="button" class="chip" data-add="${n}">+${n}</button>`).join('')+'</div>':''}</div>`;
  }
  h+='</form>';
  const foot=`<button class="btn sec" data-act="close">取消</button>${s.again&&mode!=='edit'?'<button class="btn sec" id="saveAgain">儲存並再新增一筆</button>':''}<button class="btn" id="saveBtn">儲存</button>`;
  openModal((mode==='edit'?'修改':mode==='copy'?'複製':'新增')+s.label,h,foot);
  const F=$('#F');
  /* --- 部位選擇(大項 → 細項)與症狀程度 --- */
  let sel={};
  String(val('症狀')).split('、').filter(Boolean).forEach(e=>{const [n,o]=parseSym(e);sel[n]=o});
  if(s.hasPart){
    const H1=F.elements['症狀部位大項'],H2=F.elements['症狀部位細項'];
    let toothOpen=false,toothMode='恆牙',toothN='換牙';
    const drawSyms=()=>{
      const box=$('#syms');if(!box)return;
      const base=(PARTS[H1.value]&&PARTS[H1.value].sub[H2.value])||[];
      const list=[...base,...Object.keys(sel).filter(k=>!base.includes(k))];
      if(!list.length){box.innerHTML=`<div class="note">${H2.value?'這個細項沒有預設症狀,請在「其他說明」填寫':'請先選上面的部位大項與細項'}</div>`;return}
      box.innerHTML=list.map(n=>{
        const sp=specOf(H1.value,H2.value,n);
        const D=sp.t==='deep'?sp.lv:sp.t==='tooth'?TOOTH:null;
        if(D){
          const cur=(sel[n]||'').split('/');
          const lv=D.map((l,li)=>{const opts=typeof l[1]==='function'?l[1](cur):l[1];return `<div class="so" style="margin:3px 0"><span class="lbl">${esc(l[0])}</span>${opts.length?opts.map(o=>`<button type="button" class="opt ${cur[li]===o?'on':''}" data-s="${esc(n)}" data-lv="${li}" data-o="${esc(o)}">${esc(o)}</button>`).join(''):'<span class="note" style="margin:0">請先選上一層</span>'}</div>`}).join('');
          let extra='';
          if(sp.t==='tooth'){toothN=n;const h=toothHint(cur);extra=(h?`<div class="note" style="margin:4px 0">${h}</div>`:'')+`<button type="button" class="btn sec sm" data-tb="1" style="margin-top:4px">${toothOpen?'收起牙齒圖':'牙齒圖與換牙時間表'}</button>`}
          return `<div class="sx"><div class="sn">${esc(n)}</div><div style="flex:1;min-width:0">${lv}${extra}</div></div>${sp.t==='tooth'&&toothOpen?toothPanel(cur,toothMode):''}`;
        }
        const opts=sp.o;
        return `<div class="sx"><div class="sn">${esc(n)}</div><div class="so">${opts.map((o,i)=>`<button type="button" class="opt ${sel[n]===o?'on':''}" style="--c:${optColor(i,opts.length)}" data-s="${esc(n)}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
      }).join('');
    };
    const drawParts=()=>{
      $('#pp').innerHTML=Object.keys(PARTS).map(p=>`<button type="button" class="chip pc ${H1.value===p?'on':''}" style="--c:${pcol(p)}" data-p1="${esc(p)}">${picon(p,18)}${p}</button>`).join('');
      const subs=H1.value&&PARTS[H1.value]?Object.keys(PARTS[H1.value].sub):[];
      $('#pd').innerHTML=subs.map(x=>`<button type="button" class="chip pc ${H2.value===x?'on':''}" style="--c:${pcol(H1.value)}" data-p2="${esc(x)}">${x}</button>`).join('');
    };
    const PX=$('#px');
    const eyeMode=()=>H1.value==='眼睛'&&(!PX.value.trim()||eyeParse(PX.value));
    const pxHint=()=>{const eye=eyeMode();$('#pxe').hidden=!eye;$('#pxo').hidden=eye;if(eye&&PX.value.trim()&&!$('#pxr').value&&!$('#pxl').value){const e=eyeParse(PX.value);$('#pxr').value=e[0];$('#pxl').value=e[1]}if(eye)PX.value=''};
    drawParts();drawSyms();pxHint();
    F.addEventListener('click',e=>{
      const a=e.target.closest('[data-p1]'),c=e.target.closest('[data-p2]'),o=e.target.closest('[data-s]'),tt=e.target.closest('[data-tt]'),tb=e.target.closest('[data-tb]'),tm=e.target.closest('[data-tm]');
      if(a){if(H1.value!==a.dataset.p1){H1.value=a.dataset.p1;H2.value='';sel={};const subs=Object.keys(PARTS[H1.value].sub);if(subs.length===1)H2.value=subs[0]}drawParts();drawSyms();pxHint()}
      else if(c){if(H2.value!==c.dataset.p2){H2.value=c.dataset.p2;sel={}}drawParts();drawSyms()}
      else if(o){const n=o.dataset.s,v=o.dataset.o;
        if(o.dataset.lv!==undefined){const sp=specOf(H1.value,H2.value,n),D=sp.t==='deep'?sp.lv:TOOTH,cur=(sel[n]||'').split('/');while(cur.length<D.length)cur.push('');const li=+o.dataset.lv;cur[li]=cur[li]===v?'':v;for(let q=li+1;q<D.length;q++)if(typeof D[q][1]==='function')cur[q]='';const j=cur.join('/');if(/^\/*$/.test(j))delete sel[n];else sel[n]=j.replace(/\/+$/,'')}
        else if(sel[n]===v)delete sel[n];else sel[n]=v;
        drawSyms()}
      else if(tb){toothOpen=!toothOpen;drawSyms()}
      else if(tm){toothMode=tm.dataset.tm;drawSyms()}
      else if(tt){const d=tt.dataset;sel[toothN]=[d.pos,d.st,d.name,d.side].join('/');drawSyms()}
    });
  }
  const calc=()=>{const e=F.elements['BMI'];if(e)e.value=bmi(F.elements['身高'].value,F.elements['體重'].value)};
  if(F.elements['BMI']){F.elements['身高'].oninput=calc;F.elements['體重'].oninput=calc;if(fresh||mode==='copy')calc()}
  const slc=()=>{const e=F.elements['睡眠時數'];if(!e)return;const a=minOf(F.elements['睡覺時間'].value),b=minOf(F.elements['起床時間'].value);if(a===null||b===null){e.value='';return}let d=b-a;if(d<=0)d+=1440;e.value=Math.round(d/6)/10};
  if(F.elements['睡眠時數']){F.elements['睡覺時間'].oninput=slc;F.elements['起床時間'].oninput=slc;slc()}
  F.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a){const w=F.elements['飲水'];w.value=(Number(w.value)||0)+Number(a.dataset.add)}});
  const save=again=>{
    if(!F.reportValidity())return;
    let o={id:mode==='edit'?b.id:uid()};
    if(dk)o[dk]=F.elements[dk].value;
    o['姓名']=F.elements['姓名'].value.trim();
    for(const f of s.fields){
      if(f.g)continue;
      if(f.t==='part'){o['症狀部位大項']=F.elements['症狀部位大項'].value;const ex=$('#pxe').hidden?($('#px').value||'').trim():[($('#pxr').value.trim()?'右'+$('#pxr').value.trim():''),($('#pxl').value.trim()?'左'+$('#pxl').value.trim():'')].filter(Boolean).join(' ');o['症狀部位細項']=(F.elements['症狀部位細項'].value+(ex?' '+ex:'')).trim();continue}
      if(f.t==='chips'){o['症狀']=Object.entries(sel).map(([k,v])=>v?`${k}(${v})`:k).join('、');continue}
      const v=F.elements[f.k].value;
      o[f.k]=(!f.t||f.t==='num')&&f.t!=='text'&&v!==''?Number(v):v;
    }
    if(mode==='edit')o={...b,...o};
    if(s.unique&&mode!=='edit'){
      const ex=(DB[s.sheet]||[]).find(r=>r['姓名']===o['姓名']&&r[dk]===o[dk]);
      if(ex){if(!confirm(`${o['姓名']} 在 ${o[dk]} 已有一筆${s.label},要覆蓋嗎?`))return;o.id=ex.id}
    }
    if(s.nameText&&mode==='edit'&&b['姓名']&&b['姓名']!==o['姓名']&&!confirm(`把過去所有紀錄的「${b['姓名']}」一起改成「${o['姓名']}」?`))return;
    if(s.nameText&&mode==='edit'&&b['姓名']!==o['姓名']){renameAll(b['姓名'],o['姓名']);if(cfg.person===b['姓名']){cfg.person=o['姓名'];saveCfg()}}
    putRow(s.sheet,o);closeModal();toast('已儲存');render();
    if(again)openForm(key,o,'again');
  };
  $('#saveBtn').onclick=()=>save(false);
  const sa=$('#saveAgain');if(sa)sa.onclick=()=>save(true);
}
function renameAll(from,to){
  Object.values(SEC).forEach(s=>{if(s.nameText)return;(DB[s.sheet]||[]).forEach(r=>{if(r['姓名']===from){r['姓名']=to;enqueue({action:'upsert',sheet:s.sheet,row:r})}})});
  SV('hr_db',DB);
}

/* ============ 健檢表單 ============ */
function openCheckup(row,mode){
  if(!persons().length){toast('請先到「設定」新增人員');UI.tab='settings';closeModal();render();return}
  const b=row||{},fresh=mode==='new';
  const flags=new Set(fresh?[]:String(b['異常項目']||'').split('、').filter(Boolean));
  const v=k=>fresh?'':(b[k]??'');
  let h=`<form id="F" autocomplete="off"><div class="grid">
  <div class="fld"><label>健檢日期</label><input type="date" name="健檢日期" value="${esc(mode==='edit'?b['健檢日期']:TODAY())}" required></div>
  <div class="fld"><label>姓名</label>${personSel(fresh?(cfg.person||persons()[0]):b['姓名'])}</div>
  <div class="fld"><label>健檢醫院</label><input name="健檢醫院" value="${esc(v('健檢醫院'))}"></div>
  <div class="fld"><label>方案費用 <small>元</small></label><input type="number" inputmode="decimal" name="方案費用" value="${esc(v('方案費用'))}"></div>
  <div class="fld full"><label>備註</label><textarea name="備註" rows="2">${esc(v('備註'))}</textarea></div></div>
  <div class="gh" style="margin:14px 0 8px">檢查項目(有標準值的項目,超出會自動標紅色警示;也可以手動按「異常」)</div>
  <input type="search" id="iq" placeholder="搜尋項目(中英文),例如 肝、血糖、LDL、ALT" style="margin-bottom:10px">`;
  CK.forEach((g,gi)=>{
    const n=g[2].filter(i=>v(i[0])!=='').length;
    h+=`<details class="grp" data-g="${gi}" ${n?'open':''}><summary>${ic(g[1],null,22)}<span style="color:${ICOL[g[1]]}">${L2(g[0])}</span><span class="cnt">已填 <span class="gn">${n}</span>/${g[2].length}</span></summary><div class="items">`;
    g[2].forEach(i=>{
      const bad=flags.has(i[0]);
      h+=`<div class="it ${bad?'bad':''}" data-k="${esc(i[0])}" data-en="${esc(EN[i[0]]||'')}"><label>${L2(i[0])}${i[1]?` <small style="color:var(--pri)">${i[1]}</small>`:''}<span class="wi">${ic('warn','#ff6b6b',16)}</span><small class="sd"></small></label><div class="row">${i[2]==='t'?`<textarea name="${esc(i[0])}" rows="3">${esc(v(i[0]))}</textarea>`:`<input type="number" step="any" inputmode="decimal" name="${esc(i[0])}" value="${esc(v(i[0]))}" ${i[0]==='BMI'?'readonly':''}>`}<button type="button" class="flag ${bad?'on':''}" title="標記異常">異常</button></div></div>`;
    });
    h+='</div></details>';
  });
  h+='</form>';
  openModal((mode==='edit'?'修改':mode==='copy'?'複製':'新增')+'健康檢查',h,'<button class="btn sec" data-act="close">取消</button><button class="btn" id="saveBtn">儲存</button>');
  const F=$('#F');
  const recount=()=>F.querySelectorAll('details.grp').forEach(d=>{d.querySelector('.gn').textContent=[...d.querySelectorAll('input,textarea')].filter(x=>x.value!=='').length});
  const setBad=(it,on)=>{const k=it.dataset.k;on?flags.add(k):flags.delete(k);it.classList.toggle('bad',on);it.querySelector('.flag').classList.toggle('on',on)};
  const autoOne=(it,sex)=>{const k=it.dataset.k,inp=it.querySelector('input'),sd=it.querySelector('.sd'),rt=refText(k,sex);sd.textContent=rt?'標準 '+rt:'';if(refOf(k,sex))setBad(it,outOf(k,inp.value,sex))};
  const autoAll=()=>{const sex=sexOf(F.elements['姓名'].value);F.querySelectorAll('.it').forEach(it=>autoOne(it,sex))};
  autoAll();
  F.addEventListener('input',e=>{
    if(e.target.id==='iq')return;
    if(e.target.name==='姓名')autoAll();
    else{const it=e.target.closest('.it');if(it)autoOne(it,sexOf(F.elements['姓名'].value))}
    if(e.target.name==='身高'||e.target.name==='體重'){F.elements['BMI'].value=bmi(F.elements['身高'].value,F.elements['體重'].value)}
    recount();
  });
  F.addEventListener('click',e=>{const f=e.target.closest('.flag');if(!f)return;const it=f.closest('.it');setBad(it,!flags.has(it.dataset.k))});
  $('#iq').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    F.querySelectorAll('details.grp').forEach(d=>{
      let any=false;
      d.querySelectorAll('.it').forEach(it=>{const m=!q||(it.dataset.k+' '+it.dataset.en).toLowerCase().includes(q)||d.firstElementChild.textContent.toLowerCase().includes(q);it.classList.toggle('hide',!m);if(m)any=true});
      d.style.display=any?'':'none';if(q&&any)d.open=true;
    });
  };
  $('#saveBtn').onclick=()=>{
    if(!F.reportValidity())return;
    let o={id:mode==='edit'?b.id:uid(),'健檢日期':F.elements['健檢日期'].value,'姓名':F.elements['姓名'].value,'健檢醫院':F.elements['健檢醫院'].value.trim(),'方案費用':F.elements['方案費用'].value===''?'':Number(F.elements['方案費用'].value)};
    CKITEMS.forEach(i=>{const x=F.elements[i.k].value;o[i.k]=i.t==='n'&&x!==''?Number(x):x});
    o['異常項目']=[...flags].join('、');o['備註']=F.elements['備註'].value;
    if(mode==='edit')o={...b,...o};
    putRow('健檢紀錄',o);closeModal();toast('已儲存');render();
  };
}

/* ============ 健檢歷年比較 ============ */
function drawCompare(){
  const L=$('#list'),f=UI.f.checkup=UI.f.checkup||{};
  const ps=cfg.person?[cfg.person]:persons();
  if(!ps.length){L.innerHTML='<div class="empty">請先新增人員</div>';return}
  let h=`<div class="bar"><select id="cg" style="flex:1"><option value="">全部大項</option>${CK.map((g,i)=>`<option value="${i}" ${String(f.cg)===String(i)?'selected':''}>${g[0]}</option>`).join('')}</select><input type="search" id="ci" placeholder="搜尋項目" value="${esc(f.ci||'')}" style="flex:1"></div>`;
  const blocks=ps.map(who=>({who,sex:sexOf(who),recs:(DB['健檢紀錄']||[]).filter(r=>r['姓名']===who).sort((a,b)=>(b['健檢日期']||'').localeCompare(a['健檢日期']||'')).slice(0,8)})).filter(b=>b.recs.length);
  if(!blocks.length){L.innerHTML=h+'<div class="empty">'+(cfg.person?esc(cfg.person)+' ':'')+'還沒有健檢紀錄</div>';bindCmp();return}
  h+=ckChart(blocks.map(b=>b.who),f)+'<div class="note" style="margin:0 0 8px">點項目名稱可以看趨勢圖;紅字加警示符號 = 超出標準值,或你標記為異常</div>';
  blocks.forEach(b=>{
    const {who,sex,recs}=b;
    h+=`<h3 style="margin:14px 2px 8px;color:var(--pri)">${esc(who)}${sex?'':' <small style="color:var(--mut);font-weight:400">(未填性別,部分標準值不顯示)</small>'}</h3><div class="tbl"><table><tr><th>項目</th><th>標準</th>`+recs.map(r=>`<th>${esc(r['健檢日期'])}<br><small style="font-weight:400">${esc(r['健檢醫院']||'')}</small></th>`).join('')+'</tr>';
    CK.forEach((g,gi)=>{
      if(f.cg!==undefined&&f.cg!==''&&String(f.cg)!==String(gi))return;
      const rows=g[2].filter(i=>(!f.ci||(i[0]+' '+(EN[i[0]]||'')).toLowerCase().includes(f.ci.toLowerCase()))&&recs.some(r=>r[i[0]]!==undefined&&r[i[0]]!==''));
      if(!rows.length)return;
      h+=`<tr class="gr"><td colspan="${recs.length+2}" style="color:${ICOL[g[1]]}">${ic(g[1],null,18)} ${L2(g[0])}</td></tr>`;
      rows.forEach(i=>{
        h+=`<tr><td class="ck ${f.item===i[0]?'sel':''}" data-act="ckitem" data-k="${esc(i[0])}"><span class="hl">${L2(i[0])}${i[1]?` <small style="color:var(--mut);font-weight:400">${i[1]}</small>`:''}</span></td><td style="color:var(--mut)">${esc(refText(i[0],sex))||'—'}</td>`+recs.map(r=>{const bad=ckBad(r,i[0],sex);const x=r[i[0]];return `<td class="${bad?'bad':''} ${i[2]==='t'?'tt':''}">${bad?ic('warn','#ff6b6b',14):''}${x===undefined||x===''?'—':esc(i[2]==='t'?fmtMulti(x):x)}</td>`}).join('')+'</tr>';
      });
    });
    h+='</table></div>';
  });
  h+='<div class="note">每人最多顯示最近 8 次。標準值是一般成人的參考範圍,各醫院略有不同,請以你的報告為準。</div>';
  L.innerHTML=h;bindCmp();
}
function bindCmp(){
  const f=UI.f.checkup;
  $('#cg').onchange=e=>{f.cg=e.target.value;drawCompare()};
  $('#ci').oninput=e=>{f.ci=e.target.value;const p=e.target.selectionStart;drawCompare();const n=$('#ci');n.focus();n.setSelectionRange(p,p)};
}

/* ============ 總覽 ============ */
/* ============ 大補帖:每人一頁的統計分析、白話建議,以及 AI 即時分析 ============ */
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const avgOf=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

  const wTarget=wt?Math.max(1000,Math.min(2500,Math.round(wt*30/50)*50)):1500;

const DT=s=>new Date(s+'T00:00:00');

function periodInfo(name){
  const ev=[];
  (DB['身體狀況']||[]).filter(r=>r['姓名']===name&&r['日期']).forEach(r=>String(r['症狀']||'').split('、').forEach(e=>{const [n,o]=parseSym(e);if(n==='月經'&&o)ev.push({d:r['日期'],st:o.split('/')[0],fl:o.split('/')[1]||''})}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  const starts=[];ev.filter(e=>e.st==='開始').forEach(e=>{if(!starts.length||dfd(starts[starts.length-1],e.d)>=10)starts.push(e.d)});
  if(!starts.length)return null;
  const gaps=[];for(let i=1;i<starts.length;i++)gaps.push(dfd(starts[i-1],starts[i]));
  const g=gaps.filter(x=>x>=18&&x<=60).slice(-6);

  const lens=starts.map(s=>{const e=ev.find(x=>x.st==='結束'&&dfd(s,x.d)>=0&&dfd(s,x.d)<=14);return e?dfd(s,e.d)+1:null}).filter(x=>x);
  const pl=lens.length?Math.round(avgOf(lens)):5;
  return {starts,cl,pl,reg:g.length>=2,gaps:g,lensKnown:lens.length};
}

  h+=`<div class="chips" style="margin-bottom:12px">${[14,30,90].map(d=>`<button class="chip sm ${d===P.days?'on':''}" data-act="pd" data-v="${d}">最近 ${d} 天</button>`).join('')}</div>`;
  if(S.missing.length){const pr=S.per;h+=`<div class="card" style="border-color:var(--warn)"><b>${esc(P.who)} 還沒填${S.missing.join('、')}</b><div class="note">補上才能判斷身高、睡眠時數、腰圍是否正常。</div>${pr.id?`<button class="btn sm" style="margin-top:8px" data-act="edit" data-k="people" data-id="${esc(pr.id)}">現在補上</button>`:''}</div>`}
  h+=`<div class="home-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${S.tiles.map(t=>`<div class="card" style="margin:0"><div class="note" style="margin:0">${esc(t[0])}</div><div style="font-weight:700;color:var(--pri);margin:2px 0">${esc(t[1])}</div><div class="note" style="margin:0">${esc(t[2])}</div></div>`).join('')}</div>`;
  if(S.sym.length)h+=`<div class="card"><div class="ch"><b>常見症狀(天數)</b></div><div class="card-h" style="margin-bottom:0">${S.sym.slice(0,8).map(x=>`<span class="tag">${esc(x[0])} ${x[1]}</span>`).join('')}</div></div>`;
  h+=periodHTML(P.who,S);
  ['飲食','運動','作息'].forEach(g=>{
    const Lt=S.tips.filter(t=>t.g===g).sort((a,b)=>({warn:0,info:1,ok:2}[a.lv]-{warn:0,info:1,ok:2}[b.lv]));
    if(!Lt.length)return;
    h+=`<div class="card"><div class="ch"><b style="display:flex;align-items:center;gap:6px">${ic(GI[g][0],GI[g][1],22)}${g}</b></div>${Lt.map(t=>`<div style="padding:9px 0;border-top:1px solid var(--line)"><span class="tag" style="color:${lvc[t.lv]};background:color-mix(in srgb,${lvc[t.lv]} 15%,transparent)">${lvt[t.lv]}</span><div style="margin:6px 0 2px;font-weight:700">${esc(t.why)}</div><div style="color:var(--ink)">${esc(t.tip)}</div>${t.links&&t.links.length?`<div class="chips" style="margin-top:7px">${t.links.map(l=>`<a class="chip sm" href="${YT(l[1])}" target="_blank" rel="noopener" style="text-decoration:none">${ic('vitals',null,16)}看示範:${esc(l[0])}</a>`).join('')}</div>`:''}</div>`).join('')}</div>`;
  });
  h+=`<div class="note">建議是依你輸入的紀錄用規則算出來的生活提醒,不是醫療診斷。有不舒服或數值持續異常,請看醫師。身高偏矮的判斷只是粗略參考,請以健康手冊成長曲線為準。</div>`;
  return h;
}
function homeHTML(){
  const who=cfg.person;const t=TODAY();
  const rows=sh=>(DB[sh]||[]).filter(r=>!who||r['姓名']===who);
  const water=rows('飲食飲水').filter(r=>r['日期']===t).reduce((a,r)=>a+(Number(r['飲水'])||0),0);
  const medsT=rows('用藥紀錄').filter(r=>r['日期']===t).length;
  const symT=rows('身體狀況').filter(r=>r['日期']===t).length;
  const byDT=(a,b)=>((b['日期']||'')+(b['時間']||'')).localeCompare((a['日期']||'')+(a['時間']||''));
  const lv=rows('身體數值').sort(byDT)[0];
  const ls=rows('身體狀況').reverse().sort(byDT);
  const lc=rows('健檢紀錄').sort((a,b)=>(b['健檢日期']||'').localeCompare(a['健檢日期']||''))[0];
  let h=`<div class="dh" style="margin-top:0">${t} ${wday(t)} · ${who?esc(who):'全部成員'}</div>`;
  h+='<div class="home-grid">'+['vitals','diet','meds','symptoms','visits','checkup'].map(k=>`<button class="qa" data-act="new" data-k="${k}">${ic(SEC[k].i)}${SEC[k].label}</button>`).join('')+'</div>';
  h+=`<div class="stat"><div><b>${water}</b><small>今日飲水 ml</small></div><div><b>${medsT}</b><small>今日用藥</small></div><div><b>${symT}</b><small>今日症狀</small></div></div>`;
  const KEYS=['vitals','diet','meds','symptoms','visits','checkup'];
  const hf=UI.hf||'',hn=UI.hn||60;
  const feed=[];
  KEYS.forEach(k=>rows(SEC[k].sheet).slice().reverse().forEach(r=>feed.push({k,r,d:String(r[k==='checkup'?'健檢日期':dkOf(SEC[k])]||''),t:String(r['時間']||'')})));
  feed.sort((a,b)=>b.d.localeCompare(a.d)||b.t.localeCompare(a.t));
  const shown=feed.filter(x=>!hf||x.k===hf);
  h+=`<h3>所有紀錄 <small style="color:var(--mut);font-weight:400">共 ${shown.length} 筆,新的在上面,可直接修改</small></h3>`;
  h+=`<div class="filters"><button class="chip ${hf?'':'on'}" data-act="hf" data-v="">全部 <small>${feed.length}</small></button>${KEYS.map(k=>{const n=feed.filter(x=>x.k===k).length;return `<button class="chip ${hf===k?'on':''}" data-act="hf" data-v="${k}">${ic(SEC[k].i,null,16)}${SEC[k].label} <small>${n}</small></button>`}).join('')}</div>`;
  if(!shown.length)h+='<div class="empty" style="padding:20px">還沒有紀錄,按上面的按鈕新增第一筆</div>';
  let cur='';
  shown.slice(0,hn).forEach(x=>{if(x.d!==cur){cur=x.d;h+=`<div class="dh" style="margin-top:12px">${esc(cur)} ${wday(cur)}</div>`}h+=cardHTML(x.k,x.r,true)});
  if(shown.length>hn)h+=`<button class="btn sec" style="width:100%" data-act="hmore">顯示更多(還有 ${shown.length-hn} 筆)</button>`;
  if(!persons().length)h+='<div class="card">第一次使用?先到「設定」新增家人。</div>';
  return h;
}

/* ============ 設定 ============ */
function settingsHTML(){
  let h=`<h3 style="margin-top:0">人員管理</h3>`+(persons().length?(DB['人員']||[]).map(r=>`<div class="pr"><b>${esc(r['姓名'])}</b><span class="tag">${esc(r['性別']||'')} ${esc(r['生日']||'')}</span><button class="btn sec sm" data-act="edit" data-k="people" data-id="${r.id}">修改</button><button class="btn warn sm" data-act="del" data-k="people" data-id="${r.id}">刪除</button></div>`).join(''):'<div class="empty" style="padding:14px">尚未新增人員</div>')+`<button class="btn" data-act="new" data-k="people">＋ 新增人員</button>`;
  h+=`<h3>部位與症狀選項</h3><div class="note" style="margin:0">部位、細項、症狀、程度的選項放在 Google 試算表的「選項」分頁。要增減就直接在試算表改,改完回到 APP 會自動更新(或按「立即同步」/重新整理),不用換 index.html。</div>`;
  h+=`<h3>Google Sheet 連線</h3>`;
  if(SCRIPT_URL)h+=`<div class="note" style="margin-bottom:10px">已連線。每次按「儲存」,資料會自動寫入 Google Sheet。</div><button class="btn sec" data-act="pull">立即同步</button>`;
  else h+=`<div class="fld"><label>Apps Script 網頁應用程式網址</label><input id="cu" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div><div class="fld" style="margin-top:8px"><label>密碼(選填,要和 Code.gs 的 TOKEN 一樣)</label><input id="ct" type="password" value="${esc(cfg.token||'')}" autocomplete="off"></div><div class="bar" style="margin-top:10px"><button class="btn" data-act="saveurl">儲存並連線</button><button class="btn sec" data-act="pull">立即同步</button></div>`;
  return h;
}

/* ============ 事件 ============ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,k=el.dataset.k,id=el.dataset.id;
  const find=()=>(DB[SEC[k].sheet]||[]).find(r=>r.id===id);
  if(a==='tab'){UI.tab=el.dataset.t;render();window.scrollTo(0,0)}
  else if(a==='new')openForm(k,null,'new');
  else if(a==='edit')openForm(k,find(),'edit');
  else if(a==='copy')openForm(k,find(),'copy');
  else if(a==='del'){if(confirm(k==='people'?'刪除這位成員?(他的紀錄會保留)':'確定刪除這筆紀錄?')){delRow(SEC[k].sheet,id);toast('已刪除');render()}}
  else if(a==='close')closeModal();
  else if(a==='part'){UI.f[UI.tab].part=el.dataset.p;drawList(UI.tab)}
  else if(a==='hf'){UI.hf=el.dataset.v;UI.hn=60;render()}
  else if(a==='hmore'){UI.hn=(UI.hn||60)+60;render()}
  else if(a==='pl'){UI.plan.who=el.dataset.w;render()}
  else if(a==='pd'){UI.plan.days=+el.dataset.v;render()}
  else if(a==='cmp'){UI.cmp=!UI.cmp;render()}
  else if(a==='sync'){if(!cfg.url){UI.tab='settings';render()}else{lastErr='';await flush();if(!Q.length&&!lastErr)toast('已同步')}}
  else if(a==='saveurl'){cfg.url=$('#cu').value.trim();cfg.token=($('#ct')?$('#ct').value.trim():cfg.token)||'';saveCfg();if(!cfg.url){render();return}if(await pull(true)){toast('連線成功');render()}else{toast('連線失敗:'+(lastErr||'請檢查網址'))}}
  else if(a==='pull')pull(false);
  else if(a==='who'){cfg.person=el.dataset.w;saveCfg();render()}
  else if(a==='rg'){UI.f[UI.tab].rg=el.dataset.v;drawList(UI.tab)}
  else if(a==='mt'){UI.f[UI.tab].m=el.dataset.v;drawList(UI.tab)}
  else if(a==='hc'){const f=UI.f[UI.tab];f.hc=!f.hc;drawList(UI.tab)}
  else if(a==='ckitem'){const f=UI.f.checkup;f.item=(f.item===el.dataset.k)?'':el.dataset.k;drawCompare()}
});
document.addEventListener('input',e=>{
  const f=UI.f[UI.tab];if(!f)return;
  if(e.target.id==='q'){f.q=e.target.value;drawList(UI.tab)}
  else if(e.target.id==='df'){f.from=e.target.value;drawList(UI.tab)}
  else if(e.target.id==='dt'){f.to=e.target.value;drawList(UI.tab)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('online',()=>{lastErr='';flush()});
setInterval(()=>{if(Q.length&&!flushing){lastErr='';flush()}},30000);
/* 自動從 Sheet 更新:回到這個分頁時、以及每 60 秒(試算表手動輸入的資料會自動出現) */
let lastPull=0;
const autoPull=()=>{if(!cfg.url||flushing||Q.length||document.hidden||!$('#modal').hidden||Date.now()-lastPull<15000)return;lastPull=Date.now();pull(true,true)};
document.addEventListener('visibilitychange',autoPull);window.addEventListener('focus',autoPull);
setInterval(autoPull,60000);

render();
if(cfg.url)pull(true);
if(!persons().length&&!cfg.url){UI.tab='settings';render()}
</script>
</body>
</html>
