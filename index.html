<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>養序</title>
<style>
:root{--bg:#0a0a0b;--card:#141416;--card2:#1a1a1d;--ink:#f1ede6;--mut:#8d8a84;--pri:#d4b483;--pri2:rgba(212,180,131,.12);--on:#14110c;--warn:#ff7a7a;--warn2:rgba(255,122,122,.12);--line:#27272b;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{margin:0;font:15px/1.55 -apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei","微軟正黑體",sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(900px 400px at 85% -10%,rgba(212,180,131,.08),transparent 60%)}
h1,h3,small{font-size:inherit}
button{font:inherit;cursor:pointer}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
header{position:sticky;top:0;z-index:20;background:rgba(10,10,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header h1{font-weight:700;margin:0;flex:1;min-width:120px;color:var(--pri);display:flex;align-items:center;gap:8px}
header select{font:inherit;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card2);color:var(--ink);max-width:140px;width:auto}
#sync{background:transparent;border-radius:20px;padding:5px 12px;border:1px solid var(--line);color:var(--mut)}
nav{background:var(--bg);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px}
@media(min-width:760px){nav{grid-template-columns:repeat(8,1fr)}}
nav button{border:0;background:none;padding:8px 2px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button.on{color:var(--ink);border-color:var(--pri)}
.wrap{max-width:980px;margin:0 auto;padding:14px 14px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input[type=search],.bar input[type=date]{flex:1;min-width:130px}
input,select,textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink)}
input::placeholder,textarea::placeholder{color:#5f5d59}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri2)}
input[readonly]{background:#101012;color:var(--mut)}
.btn{border:1px solid var(--pri);border-radius:10px;padding:9px 16px;background:var(--pri);color:var(--on);font-weight:700}
.btn.sec{background:transparent;color:var(--pri);border-color:rgba(212,180,131,.4)}
.btn.warn{background:transparent;color:var(--warn);border-color:rgba(255,122,122,.35)}
.btn.sm{padding:5px 11px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 13px;color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on)}
.chip.pc{--c:#9aa0a6}
.chip.pc.on{background:color-mix(in srgb,var(--c) 22%,transparent);border-color:var(--c);color:var(--ink)}
.chip small{opacity:.7;margin-left:2px;font-weight:400}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters .chip{padding:4px 11px}
.chip.sm{padding:3px 11px}
.dh{margin:18px 2px 8px;font-weight:700;color:var(--pri)}
.card{background:var(--card);border-radius:var(--r);padding:13px 15px;margin-bottom:9px;border:1px solid var(--line)}
.card-h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.card-h b{margin-right:auto}
.tag{background:#222226;border-radius:20px;padding:2px 10px;color:var(--mut);display:inline-flex;align-items:center;gap:5px}
.tag .ic{width:16px;height:16px;vertical-align:middle}
.tag.part{font-weight:700}
.tag.sv{background:transparent;border:1px solid;font-weight:700}
.kvs{display:flex;flex-wrap:wrap;gap:6px 16px}
.kv i{font-style:normal;color:var(--mut);margin-right:5px}
.kv.bad{color:var(--warn);font-weight:600}
.note{color:var(--mut);margin-top:4px;white-space:pre-wrap}
.acts{display:flex;gap:6px;margin-top:10px}
.empty{text-align:center;color:var(--mut);padding:44px 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.fld label{display:block;color:var(--mut);margin-bottom:4px}
.fld label small{color:var(--pri)}
.full{grid-column:1/-1}
.gh{font-weight:700;color:var(--pri);margin-top:8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.sx .sn{font-weight:700;min-width:5.5em}
.so{display:flex;gap:6px;flex-wrap:wrap}
.lbl{color:var(--mut);min-width:4.5em;align-self:center}
.opt{--c:#d4b483;border:1px solid var(--line);background:var(--card2);color:var(--ink);border-radius:20px;padding:4px 14px;font-weight:700}
.opt.on{background:color-mix(in srgb,var(--c) 25%,transparent);border-color:var(--c);color:var(--c)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);width:100%;max-width:760px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
@media(min-width:760px){.modal{align-items:center}.sheet{border-radius:20px}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);color:var(--pri);font-weight:700}
.sh button{border:0;background:none;color:var(--mut)}
.mbody{overflow:auto;padding:16px 18px;flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
details.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
details.grp>summary{padding:11px 13px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary .cnt{margin-left:auto;font-weight:400;color:var(--mut)}
details.grp[open]>summary{border-bottom:1px solid var(--line);background:var(--pri2);border-radius:12px 12px 0 0}
.items{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;padding:12px}
.it{display:flex;flex-direction:column}
.it label{color:var(--mut)}
.it .row{display:flex;gap:4px}
.flag{border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:0 9px;color:#6a6862;font-weight:700;white-space:nowrap}
.flag.on{background:var(--warn2);border-color:var(--warn);color:var(--warn)}
.it.bad input{border-color:var(--warn);background:var(--warn2)}
.it.hide{display:none}
.tbl{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.tbl th{background:#1d1b17;color:var(--pri);position:sticky;top:0}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--card);font-weight:600}
.tbl th:first-child{background:#1d1b17}
.tbl td.bad{color:var(--warn);font-weight:700}
.tbl td.ck{cursor:pointer;text-decoration:underline dotted var(--pri);text-underline-offset:4px}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.lgs{margin-top:6px}
.lg{display:inline-flex;align-items:center;gap:5px;margin-right:12px;color:var(--mut)}
.lg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tbl tr.gr td{background:#19181a;font-weight:700}
.home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 4px;text-align:center;color:var(--ink);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.qa .ic{width:28px;height:28px}
.qa:active{background:var(--pri2)}
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.stat b{display:block;color:var(--pri)}
.stat small{color:var(--mut)}
h3{margin:20px 0 9px;font-weight:700;color:var(--pri)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pri);color:var(--on);font-weight:600;padding:9px 20px;border-radius:30px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
#toast.on{opacity:.97}
.pr{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 13px;margin-bottom:6px}
.pr b{flex:1}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#2e2e33;border-radius:8px}
@media(max-width:520px){.items,.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <h1 id="logo"></h1>
  <select id="who" aria-label="切換人員"></select>
  <button id="sync" data-act="sync"></button>
</header>
<nav id="nav"></nav>
<main class="wrap" id="main"></main>
<div class="modal" id="modal" hidden><div class="sheet"><div class="sh"><span id="mt"></span><button data-act="close" aria-label="關閉">×</button></div><div class="mbody" id="mbody"></div><div class="mfoot" id="mfoot"></div></div></div>
<div id="toast"></div>

<script>
/* ============ 基本工具 ============ */
const $=(s,r=document)=>r.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const TODAY=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const NOW=()=>{const d=new Date();return p2(d.getHours())+':'+p2(d.getMinutes())};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=['日','一','二','三','四','五','六'];
const wday=d=>{const t=new Date(d+'T00:00:00');return isNaN(t)?'':'(週'+WD[t.getDay()]+')'};
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch(e){return d}};
const SV=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)};

/* ============ 圖示(SVG,不會亂碼)與顏色 ============ */
const ICON={
leaf:'<path d="M5 19C5 9 10 5 20 5c0 9-4 14-12 14"/><path d="M5 19c3-5 6-8 10-10"/>',
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
vitals:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
diet:'<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/>',
meds:'<rect x="2.5" y="8" width="19" height="8" rx="4" transform="rotate(-45 12 12)"/><path d="M9 9l6 6"/>',
symptoms:'<path d="M10 4a2 2 0 0 1 4 0v9.5a4 4 0 1 1-4 0z"/><path d="M12 9v7"/>',
visits:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/>',
checkup:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/>',
settings:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
brain:'<path d="M12 4v16"/><path d="M12 6a3 3 0 0 0-6 1 3 3 0 0 0-2 4 3 3 0 0 0 2 4 3 3 0 0 0 6 2"/><path d="M12 6a3 3 0 0 1 6 1 3 3 0 0 1 2 4 3 3 0 0 1-2 4 3 3 0 0 1-6 2"/>',
eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
ent:'<path d="M7 10a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 1"/><path d="M10 10a2 2 0 0 1 4 0"/>',
lungs:'<path d="M12 3v9"/><path d="M12 8C9 8 5 10 5 16c0 3 1 4 3 4s4-1 4-4"/><path d="M12 8c3 0 7 2 7 8 0 3-1 4-3 4s-4-1-4-4"/>',
heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
stomach:'<path d="M9 3v4c0 3-5 3-5 9a5 5 0 0 0 5 5c6 0 11-3 11-9 0-4-4-4-5-7V3"/>',
liver:'<path d="M3 10c0-3 3-4 7-4h6c3 0 5 2 5 5 0 5-5 8-10 8-5 0-8-4-8-9z"/><path d="M13 10c1 2 3 3 5 3"/>',
kidney:'<path d="M9 3C5 3 3 7 3 11c0 5 3 10 7 10 2 0 3-1.5 3-3.5 0-2 2-2.5 2-5C15 7 12 3 9 3z"/><path d="M9 9c-1 1-1 3 0 4"/>',
bone:'<path d="M7 17L17 7"/><circle cx="5.5" cy="15.5" r="2.5"/><circle cx="8.5" cy="18.5" r="2.5"/><circle cx="15.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="8.5" r="2.5"/>',
limb:'<path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V6a1.5 1.5 0 0 1 3 0v8c0 4-2 7-6 7-3 0-5-2-6-5l-1-4a1.5 1.5 0 0 1 3-.5L8 13"/>',
skin:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1" fill="currentColor"/><circle cx="14.5" cy="9" r="1" fill="currentColor"/><circle cx="13" cy="14.5" r="1" fill="currentColor"/><circle cx="8.5" cy="14" r="1" fill="currentColor"/>',
body:'<circle cx="12" cy="5" r="2.5"/><path d="M12 8v7M7 11l5-2 5 2M9 21l3-6 3 6"/>',
other:'<circle cx="12" cy="12" r="9"/><circle cx="8" cy="12" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="16" cy="12" r="1.2" fill="currentColor"/>',
drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/>',
female:'<circle cx="12" cy="9" r="5"/><path d="M12 14v8M9 18h6"/>',
virus:'<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l3 3M16 16l3 3M19 5l-3 3M8 16l-3 3"/>'
};
const ICOL={leaf:'#d4b483',home:'#d4b483',vitals:'#ff6b81',diet:'#9be564',meds:'#4cc3ff',symptoms:'#ffb347',visits:'#5eead4',checkup:'#b78cff',settings:'#c9c9c9',
brain:'#b78cff',eye:'#4cc3ff',ent:'#ffb347',lungs:'#5eead4',heart:'#ff6b81',stomach:'#ffd166',liver:'#d9955f',kidney:'#5b9dff',bone:'#d6c7a1',limb:'#9be564',skin:'#ff9e7a',body:'#e8e2d6',other:'#9aa0a6',drop:'#ff4d6d',flask:'#f4a259',female:'#ff8fb8',virus:'#c084fc'};
const ic=(k,c,sz)=>`<svg class="ic" viewBox="0 0 24 24" style="color:${c||ICOL[k]||'currentColor'}${sz?`;width:${sz}px;height:${sz}px`:''}">${ICON[k]||''}</svg>`;
$('#logo').innerHTML=ic('leaf','#d4b483',24)+'養序';

/* ============ 症狀選單(可自行增減:部位 → 細項 → 症狀;順序是從頭到腳,最後是全身、其他) ============ */
const SEV=['輕微','中','嚴重'];                       /* 一般症狀的程度選項 */
const OPT={'鼻水':['微','中','多','濃'],'發燒':['低燒','中度','高燒'],'排便':['正常','偏硬','偏軟']};  /* 特別的症狀選項 */
/* 需要再往下選的症狀:每一層都是單選 */
const DEEPSYM={
 '換牙':[['位置',['上面','下面']],['乳牙／恆牙',['乳牙','恆牙']],['牙齒',c=>c[1]==='乳牙'?T_BABY:c[1]==='恆牙'?T_PERM:[]],['左右',['右','左']]],
 '月經':[['狀態',['開始','持續','結束']],['經量',['少','中','多']]]
};
const LIMBDEEP=[['左右',['左','右','雙側']],['程度',SEV]];   /* 四肢的所有症狀都會先選左右 */
const deepOf=(n,p1)=>DEEPSYM[n]||(p1==='四肢'?LIMBDEEP:null);
/* ============ 換牙資料 ============ */
const T_PERM=['中門牙','側門牙','犬齒','第一小臼齒','第二小臼齒','第一大臼齒','第二大臼齒','智齒'];
const T_BABY=['乳中門牙','乳側門牙','乳犬齒','第一乳臼齒','第二乳臼齒'];
/* 恆牙(第二次長出)大約幾歲長出:[上排, 下排] */
const AGE_PERM={'中門牙':['7-8 歲','6-7 歲'],'側門牙':['8-9 歲','7-8 歲'],'犬齒':['11-12 歲','9-10 歲'],'第一小臼齒':['10-12 歲','10-12 歲'],'第二小臼齒':['11-12 歲','11-12 歲'],'第一大臼齒':['6-7 歲(六歲齒)','6-7 歲(六歲齒)'],'第二大臼齒':['12-13 歲','12-13 歲'],'智齒':['16 歲以後','16 歲以後']};
/* 乳牙(第一次長出)[長出, 脫落]:[上排, 下排] */
const AGE_BABY={'乳中門牙':[['8-12 個月','6-7 歲'],['6-10 個月','6-7 歲']],'乳側門牙':[['9-13 個月','7-8 歲'],['10-16 個月','7-8 歲']],'乳犬齒':[['16-22 個月','10-12 歲'],['17-23 個月','9-12 歲']],'第一乳臼齒':[['13-19 個月','9-11 歲'],['14-18 個月','9-11 歲']],'第二乳臼齒':[['25-33 個月','10-12 歲'],['23-31 個月','10-12 歲']]};
function toothHint(c){
  const pos=c[0],st=c[1],t=c[2];if(!pos||!st||!t)return '';
  const pi=pos==='下面'?1:0;
  if(st==='恆牙'&&AGE_PERM[t])return `${pos}${t}:恆牙大約 ${AGE_PERM[t][pi]} 長出來`;
  if(st==='乳牙'&&AGE_BABY[t]){const a=AGE_BABY[t][pi];return `${pos}${t}:乳牙大約 ${a[0]} 長出,大約 ${a[1]} 脫落,之後長恆牙`}
  return '';
}
function toothPanel(c,mode){
  const perm=mode==='恆牙',names=perm?T_PERM:T_BABY;
  const ws=perm?[13,11,12,13,13,18,18,17]:[18,15,18,24,27];
  const hs=perm?[17,17,19,20,20,23,23,22]:[22,22,24,28,30];
  const TC=perm?['#d4b483','#ffb347','#ff6b81','#5eead4','#4cc3ff','#5b9dff','#b78cff','#c084fc']:['#d4b483','#ffb347','#ff6b81','#4cc3ff','#5b9dff'];
  const xs=[];let acc=0;ws.forEach(w=>{xs.push(acc+w/2);acc+=w+2});
  const k=88/(xs[xs.length-1]*xs[xs.length-1]);
  let g=`<text x="180" y="16" text-anchor="middle" fill="#d4b483" font-weight="700" font-size="13">上面</text><text x="180" y="330" text-anchor="middle" fill="#d4b483" font-weight="700" font-size="13">下面</text><text x="12" y="172" fill="#8d8a84" font-size="12">孩子的右</text><text x="348" y="172" text-anchor="end" fill="#8d8a84" font-size="12">孩子的左</text><text x="180" y="176" text-anchor="middle" fill="#6a6862" font-size="11">(面對孩子看)</text>`;
  ['上面','下面'].forEach(pos=>{
    const up=pos==='上面';
    [-1,1].forEach(side=>{
      names.forEach((nm,i)=>{

function putRow(sheet,o){const a=DB[sheet]=DB[sheet]||[];const i=a.findIndex(r=>r.id===o.id);if(i>=0)a[i]=o;else a.push(o);SV('hr_db',DB);enqueue({action:'upsert',sheet,row:o})}
function delRow(sheet,id){DB[sheet]=(DB[sheet]||[]).filter(r=>r.id!==id);SV('hr_db',DB);enqueue({action:'delete',sheet,id})}
function enqueue(op){
  Q=Q.filter(x=>!(x.sheet===op.sheet&&(x.row?x.row.id:x.id)===(op.row?op.row.id:op.id)&&x.action==='upsert'));
  Q.push(op);SV('hr_q',Q);flush();
}
async function api(method,payload){
  if(method==='GET'){const u=new URL(cfg.url);u.searchParams.set('action',payload.action);if(cfg.token)u.searchParams.set('token',cfg.token);const r=await fetch(u);return r.json()}
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,token:cfg.token})});
  return r.json();
}
async function flush(){
  if(!cfg.url||flushing||!Q.length){badge();return}
  flushing=true;lastErr='';badge();
  const n=Q.length;
  try{const res=await api('POST',{action:'batch',ops:Q.slice(0,n)});if(!res.ok)throw new Error(res.error||'失敗');Q=Q.slice(n);SV('hr_q',Q)}
  catch(e){lastErr=e.message||'連線失敗'}
  flushing=false;badge();
  if(!lastErr&&Q.length)flush();
}
async function pull(silent){
  if(!cfg.url){if(!silent)toast('尚未設定 Google Sheet 網址');return false}
  await flush();
  if(Q.length){toast('還有資料待同步,請稍後再試');return false}
  try{
    const i=await api('POST',{action:'init',headers:HEADERS()});if(!i.ok)throw new Error(i.error);
    const r=await api('GET',{action:'all'});if(!r.ok)throw new Error(r.error);
    DB=r.data;Object.values(SEC).forEach(s=>{DB[s.sheet]=DB[s.sheet]||[]});SV('hr_db',DB);
    if(!silent)toast('已從 Sheet 載入');render();return true;
  }catch(e){lastErr=e.message;badge();if(!silent)toast('讀取失敗:'+e.message);return false}
}
function badge(){
  const b=$('#sync');
  if(!cfg.url)b.textContent='未連線';
  else if(flushing)b.textContent='同步中…';
  else if(lastErr)b.textContent='同步失敗(點此重試)';
  else if(Q.length)b.textContent='待同步 '+Q.length;
  else b.textContent='已同步';
}

const PAL=['#d4b483','#4cc3ff','#ff6b81','#9be564','#b78cff','#ffb347','#5eead4'];

const dateOf=n=>new Date(Math.floor(n)*864e5).toISOString().slice(0,10);
const nf=v=>Math.abs(v)>=100?String(Math.round(v)):String(Math.round(v*10)/10);
const md=d=>String(d).slice(5).replace('-','/');
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const numOf=v=>{if(v===''||v===undefined||v===null)return null;const n=Number(v);return isNaN(n)?null:n};
const nodata=m=>`<div class="note" style="text-align:center;padding:16px 0;margin:0">${m}</div>`;
const legend=a=>`<div class="lgs">${a.map(x=>`<span class="lg"><i style="background:${x[1]}"></i>${esc(x[0])}</span>`).join('')}</div>`;
const rgChips=(opts,cur)=>opts.map(o=>`<button class="chip sm ${cur===o[0]?'on':''}" data-act="rg" data-v="${o[0]}">${o[1]}</button>`).join('');
function panel(key,title,rg,body){

function lineSVG(series){
  series=series.filter(s=>s.pts.length);
  if(!series.length)return nodata('這段期間還沒有資料');
  const all=series.flatMap(s=>s.pts);
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x)),y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));
  if(x1-x0<1){x0-=1;x1+=1}
  if(y1===y0){y0-=1;y1+=1}
  const pad=(y1-y0)*.15;y0-=pad;y1+=pad;
  const W=360,H=170,L=38,R=14,T=14,B=26;
  const sx=x=>L+(x-x0)/(x1-x0)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3,y=sy(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#27272b"/><text x="${L-5}" y="${y+4}" text-anchor="end" fill="#8d8a84" font-size="11">${nf(v)}</text>`}
  g+=`<text x="${L}" y="${H-6}" fill="#8d8a84" font-size="11">${md(dateOf(x0))}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#8d8a84" font-size="11">${md(dateOf(x1))}</text>`;
  series.forEach(s=>{
    const pts=s.pts.map(p=>sx(p.x).toFixed(1)+','+sy(p.y).toFixed(1)).join(' ');
    if(s.pts.length>1)g+=`<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.pts.forEach(p=>{g+=`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3.4" fill="#0a0a0b" stroke="${s.color}" stroke-width="2"><title>${esc(s.name)} ${md(p.d)} : ${nf(p.y)}</title></circle>`});
    const l=s.pts[s.pts.length-1];
    g+=`<text x="${Math.min(sx(l.x),W-R)}" y="${sy(l.y)-9}" text-anchor="end" fill="${s.color}" font-size="12" font-weight="700">${nf(l.y)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
function barSVG(cells,unit){
  const W=360,H=150,L=36,R=8,T=12,B=24,n=cells.length;
  const tot=c=>c.segs.reduce((a,s)=>a+s.v,0);
  let mx=Math.ceil(Math.max(1,...cells.map(tot)));
  const ticks=mx<=4?[...Array(mx+1).keys()]:[0,mx/2,mx];
  const bw=(W-L-R)/n,w=Math.max(3,bw*.68),every=Math.ceil(n/6);
  let g='';
  ticks.forEach(v=>{const y=T+(1-v/mx)*(H-T-B);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#27272b"/><text x="${L-5}" y="${y+4}" text-anchor="end" fill="#8d8a84" font-size="11">${nf(v)}</text>`});
  cells.forEach((c,i)=>{
    let y=H-B;const x=L+i*bw+(bw-w)/2;
    c.segs.forEach(sg=>{const h=sg.v/mx*(H-T-B);y-=h;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2" fill="${sg.c}"><title>${c.label} ${esc(sg.n)} ${nf(sg.v)}${unit||''}</title></rect>`});
    if((n-1-i)%every===0)g+=`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle" fill="#8d8a84" font-size="11">${c.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}</svg>`;
}
const VM=[['體重',['體重']],['BMI',['BMI']],['血壓',['收縮壓','舒張壓']],['脈搏',['脈搏']],['腰圍',['腰圍']],['身高',['身高']],['胸圍',['胸圍']],['臀圍',['臀圍']],['右眼視力',['右眼視力']],['左眼視力',['左眼視力']]];
function vitalsChart(rows,f){

  const stat=series.filter(s=>s.pts.length).map(s=>{const ys=s.pts.map(p=>p.y),l=s.pts[s.pts.length-1],avg=ys.reduce((a,b)=>a+b,0)/ys.length;return `<div class="note" style="margin-top:4px"><span style="color:${s.color};font-weight:700">${esc(s.name)}</span> 最新 ${nf(l.y)}(${md(l.d)}) · 最高 ${nf(Math.max(...ys))} · 最低 ${nf(Math.min(...ys))} · 平均 ${nf(avg)}</div>`}).join('');
  const body=`<div class="chips" style="margin-bottom:8px">${chips}</div>${lineSVG(series)}${series.length>1?legend(series.map(s=>[s.name,s.color])):''}${stat}${names.length>1&&cur[1].length>1?'<div class="note">多位成員時,血壓只顯示收縮壓</div>':''}`;
  return panel('vitals','數值趨勢',rgChips([['30','30天'],['90','90天'],['365','1年'],['all','全部']],rg),body);

function barPanel(key,title,rows,f,o){
  let keys=[];
  if(o.months){const d=new Date();for(let i=11;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);keys.push(t.getFullYear()+'-'+p2(t.getMonth()+1))}}
  else{const n=Number(f.rg||14);for(let i=n-1;i>=0;i--)keys.push(addDays(-i))}
  const kf=o.months?r=>String(r['日期']||'').slice(0,7):r=>r['日期'];
  const idx={};keys.forEach((k,i)=>idx[k]=i);
  const cells=keys.map(k=>({label:o.months?k.slice(2).replace('-','/'):md(k),m:{}}));
  const grp=[],cnt={};let total=0,withData=new Set();
  rows.forEach(r=>{const i=idx[kf(r)];if(i===undefined)return;const v=o.val(r);if(!v)return;const g=o.grp(r)||'未分類';if(!grp.includes(g))grp.push(g);cells[i].m[g]=(cells[i].m[g]||0)+v;total+=v;withData.add(i);(o.top?o.top(r):[]).forEach(t=>{cnt[t]=(cnt[t]||0)+1})});
  const rg=o.months?'':rgChips([['7','7天'],['14','14天'],['30','30天'],['90','90天']],String(f.rg||14));
  if(!total)return panel(key,title,rg,nodata('這段期間還沒有資料'));
  const segs=cells.map(c=>({label:c.label,segs:grp.map((g,i)=>({n:g,v:c.m[g]||0,c:o.gcol(g,i)})).filter(x=>x.v>0)}));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);

  return panel(key,title,rg,body);

      }).join('');
    };
    const drawParts=()=>{
      $('#pp').innerHTML=Object.keys(PARTS).map(p=>`<button type="button" class="chip pc ${H1.value===p?'on':''}" style="--c:${pcol(p)}" data-p1="${esc(p)}">${picon(p,18)}${p}</button>`).join('');
      const subs=H1.value&&PARTS[H1.value]?Object.keys(PARTS[H1.value].sub):[];
      $('#pd').innerHTML=subs.map(x=>`<button type="button" class="chip pc ${H2.value===x?'on':''}" style="--c:${pcol(H1.value)}" data-p2="${esc(x)}">${x}</button>`).join('');
    };
    drawParts();drawSyms();
    F.addEventListener('click',e=>{
      const a=e.target.closest('[data-p1]'),c=e.target.closest('[data-p2]'),o=e.target.closest('[data-s]'),tt=e.target.closest('[data-tt]'),tb=e.target.closest('[data-tb]'),tm=e.target.closest('[data-tm]');
      if(a){if(H1.value!==a.dataset.p1){H1.value=a.dataset.p1;H2.value='';sel={};const subs=Object.keys(PARTS[H1.value].sub);if(subs.length===1)H2.value=subs[0]}drawParts();drawSyms()}
      else if(c){if(H2.value!==c.dataset.p2){H2.value=c.dataset.p2;sel={}}drawParts();drawSyms()}
      else if(o){const n=o.dataset.s,v=o.dataset.o;
        if(o.dataset.lv!==undefined){const D=deepOf(n,H1.value),cur=(sel[n]||'').split('/');while(cur.length<D.length)cur.push('');const li=+o.dataset.lv;cur[li]=cur[li]===v?'':v;for(let q=li+1;q<D.length;q++)if(typeof D[q][1]==='function')cur[q]='';const j=cur.join('/');if(/^\/*$/.test(j))delete sel[n];else sel[n]=j.replace(/\/+$/,'')}
        else if(sel[n]===v)delete sel[n];else sel[n]=v;
        drawSyms()}
      else if(tb){toothOpen=!toothOpen;drawSyms()}
      else if(tm){toothMode=tm.dataset.tm;drawSyms()}
      else if(tt){const d=tt.dataset;sel['換牙']=[d.pos,d.st,d.name,d.side].join('/');drawSyms()}
    });
  }
  const calc=()=>{const e=F.elements['BMI'];if(e)e.value=bmi(F.elements['身高'].value,F.elements['體重'].value)};
  if(F.elements['BMI']){F.elements['身高'].oninput=calc;F.elements['體重'].oninput=calc;if(fresh||mode==='copy')calc()}
  F.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(a){const w=F.elements['飲水'];w.value=(Number(w.value)||0)+Number(a.dataset.add)}});
  const save=again=>{
    if(!F.reportValidity())return;
    let o={id:mode==='edit'?b.id:uid()};
    if(dk)o[dk]=F.elements[dk].value;
    o['姓名']=F.elements['姓名'].value.trim();
    for(const f of s.fields){
      if(f.g)continue;
      if(f.t==='part'){o['症狀部位大項']=F.elements['症狀部位大項'].value;o['症狀部位細項']=F.elements['症狀部位細項'].value;continue}
      if(f.t==='chips'){o['症狀']=Object.entries(sel).map(([k,v])=>v?`${k}(${v})`:k).join('、');continue}
      const v=F.elements[f.k].value;
      o[f.k]=(!f.t||f.t==='num')&&f.t!=='text'&&v!==''?Number(v):v;
    }
    if(mode==='edit')o={...b,...o};
    if(s.unique&&mode!=='edit'){
      const ex=(DB[s.sheet]||[]).find(r=>r['姓名']===o['姓名']&&r[dk]===o[dk]);
      if(ex){if(!confirm(`${o['姓名']} 在 ${o[dk]} 已有一筆${s.label},要覆蓋嗎?`))return;o.id=ex.id}
    }
    if(s.nameText&&mode==='edit'&&b['姓名']&&b['姓名']!==o['姓名']&&!confirm(`把過去所有紀錄的「${b['姓名']}」一起改成「${o['姓名']}」?`))return;
    if(s.nameText&&mode==='edit'&&b['姓名']!==o['姓名']){renameAll(b['姓名'],o['姓名']);if(cfg.person===b['姓名']){cfg.person=o['姓名'];saveCfg()}}
    putRow(s.sheet,o);closeModal();toast('已儲存');render();
    if(again)openForm(key,o,'again');
  };
  $('#saveBtn').onclick=()=>save(false);
  const sa=$('#saveAgain');if(sa)sa.onclick=()=>save(true);
}
function renameAll(from,to){
  Object.values(SEC).forEach(s=>{if(s.nameText)return;(DB[s.sheet]||[]).forEach(r=>{if(r['姓名']===from){r['姓名']=to;enqueue({action:'upsert',sheet:s.sheet,row:r})}})});
  SV('hr_db',DB);
}

/* ============ 健檢表單 ============ */
function openCheckup(row,mode){
  if(!persons().length){toast('請先到「設定」新增人員');UI.tab='settings';closeModal();render();return}
  const b=row||{},fresh=mode==='new';
  const flags=new Set(fresh?[]:String(b['異常項目']||'').split('、').filter(Boolean));
  const v=k=>fresh?'':(b[k]??'');
  let h=`<form id="F" autocomplete="off"><div class="grid">
  <div class="fld"><label>健檢日期</label><input type="date" name="健檢日期" value="${esc(mode==='edit'?b['健檢日期']:TODAY())}" required></div>
  <div class="fld"><label>姓名</label>${personSel(fresh?(cfg.person||persons()[0]):b['姓名'])}</div>
  <div class="fld"><label>健檢醫院</label><input name="健檢醫院" value="${esc(v('健檢醫院'))}"></div>
  <div class="fld"><label>方案費用 <small>元</small></label><input type="number" inputmode="decimal" name="方案費用" value="${esc(v('方案費用'))}"></div>
  <div class="fld full"><label>備註</label><textarea name="備註" rows="2">${esc(v('備註'))}</textarea></div></div>
  <div class="gh" style="margin:14px 0 8px">檢查項目(依大項分區,按「異常」可標記)</div>
  <input type="search" id="iq" placeholder="搜尋項目,例如 肝、血糖、LDL" style="margin-bottom:10px">`;
  CK.forEach((g,gi)=>{
    const n=g[2].filter(i=>v(i[0])!=='').length;
    h+=`<details class="grp" data-g="${gi}" ${n?'open':''}><summary>${ic(g[1],null,22)}<span style="color:${ICOL[g[1]]}">${g[0]}</span><span class="cnt">已填 <span class="gn">${n}</span>/${g[2].length}</span></summary><div class="items">`;
    g[2].forEach(i=>{
      const bad=flags.has(i[0]);
      h+=`<div class="it ${bad?'bad':''}" data-k="${esc(i[0])}"><label>${esc(i[0])}${i[1]?` <small style="color:var(--pri)">${i[1]}</small>`:''}</label><div class="row"><input type="${i[2]==='t'?'text':'number'}" ${i[2]==='t'?'':'step="any" inputmode="decimal"'} name="${esc(i[0])}" value="${esc(v(i[0]))}" ${i[0]==='BMI'?'readonly':''}><button type="button" class="flag ${bad?'on':''}" title="標記異常">異常</button></div></div>`;
    });
    h+='</div></details>';
  });
  h+='</form>';
  openModal((mode==='edit'?'修改':mode==='copy'?'複製':'新增')+'健康檢查',h,'<button class="btn sec" data-act="close">取消</button><button class="btn" id="saveBtn">儲存</button>');
  const F=$('#F');
  const recount=()=>F.querySelectorAll('details.grp').forEach(d=>{d.querySelector('.gn').textContent=[...d.querySelectorAll('input')].filter(x=>x.value!=='').length});
  F.addEventListener('input',e=>{
    if(e.target.id==='iq')return;
    if(e.target.name==='身高'||e.target.name==='體重'){F.elements['BMI'].value=bmi(F.elements['身高'].value,F.elements['體重'].value)}
    recount();
  });
  F.addEventListener('click',e=>{const f=e.target.closest('.flag');if(!f)return;const it=f.closest('.it'),k=it.dataset.k;flags.has(k)?flags.delete(k):flags.add(k);f.classList.toggle('on');it.classList.toggle('bad')});
  $('#iq').oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    F.querySelectorAll('details.grp').forEach(d=>{
      let any=false;
      d.querySelectorAll('.it').forEach(it=>{const m=!q||it.dataset.k.toLowerCase().includes(q)||d.firstElementChild.textContent.toLowerCase().includes(q);it.classList.toggle('hide',!m);if(m)any=true});
      d.style.display=any?'':'none';if(q&&any)d.open=true;
    });
  };
  $('#saveBtn').onclick=()=>{
    if(!F.reportValidity())return;
    let o={id:mode==='edit'?b.id:uid(),'健檢日期':F.elements['健檢日期'].value,'姓名':F.elements['姓名'].value,'健檢醫院':F.elements['健檢醫院'].value.trim(),'方案費用':F.elements['方案費用'].value===''?'':Number(F.elements['方案費用'].value)};
    CKITEMS.forEach(i=>{const x=F.elements[i.k].value;o[i.k]=i.t==='n'&&x!==''?Number(x):x});
    o['異常項目']=[...flags].join('、');o['備註']=F.elements['備註'].value;
    if(mode==='edit')o={...b,...o};
    putRow('健檢紀錄',o);closeModal();toast('已儲存');render();
  };
}

/* ============ 健檢歷年比較 ============ */
function drawCompare(){
  const L=$('#list'),f=UI.f.checkup=UI.f.checkup||{};
  const who=cfg.person||persons()[0];
  if(!who){L.innerHTML='<div class="empty">請先新增人員</div>';return}
  const recs=(DB['健檢紀錄']||[]).filter(r=>r['姓名']===who).sort((a,b)=>(b['健檢日期']||'').localeCompare(a['健檢日期']||'')).slice(0,8);
  let h=`<div class="bar"><b>${esc(who)}</b><select id="cg" style="flex:1"><option value="">全部大項</option>${CK.map((g,i)=>`<option value="${i}" ${String(f.cg)===String(i)?'selected':''}>${g[0]}</option>`).join('')}</select><input type="search" id="ci" placeholder="搜尋項目" value="${esc(f.ci||'')}" style="flex:1"></div>`;
  if(!recs.length){L.innerHTML=h+'<div class="empty">'+esc(who)+' 還沒有健檢紀錄</div>';bindCmp();return}
  h+=ckChart(who,f)+'<div class="note" style="margin:0 0 8px">點項目名稱可以看趨勢圖</div><div class="tbl"><table><tr><th>項目</th>'+recs.map(r=>`<th>${esc(r['健檢日期'])}<br><small style="font-weight:400">${esc(r['健檢醫院']||'')}</small></th>`).join('')+'</tr>';
  CK.forEach((g,gi)=>{
    if(f.cg!==undefined&&f.cg!==''&&String(f.cg)!==String(gi))return;
    const rows=g[2].filter(i=>(!f.ci||i[0].toLowerCase().includes(f.ci.toLowerCase()))&&recs.some(r=>r[i[0]]!==undefined&&r[i[0]]!==''));
    if(!rows.length)return;
    h+=`<tr class="gr"><td colspan="${recs.length+1}" style="color:${ICOL[g[1]]}">${ic(g[1],null,18)} ${g[0]}</td></tr>`;
    rows.forEach(i=>{
      h+=`<tr><td class="ck" data-act="ckitem" data-k="${esc(i[0])}">${esc(i[0])}${i[1]?` <small style="color:var(--mut);font-weight:400">${i[1]}</small>`:''}</td>`+recs.map(r=>{const bad=String(r['異常項目']||'').split('、').includes(i[0]);const x=r[i[0]];return `<td class="${bad?'bad':''}">${x===undefined||x===''?'—':esc(x)}${bad?' (異常)':''}</td>`}).join('')+'</tr>';
    });
  });
  h+='</table></div><div class="note">最多顯示最近 8 次;紅字代表你在該次標記為異常。</div>';
  L.innerHTML=h;bindCmp();
}
function bindCmp(){
  const f=UI.f.checkup;
  $('#cg').onchange=e=>{f.cg=e.target.value;drawCompare()};
  $('#ci').oninput=e=>{f.ci=e.target.value;const p=e.target.selectionStart;drawCompare();const n=$('#ci');n.focus();n.setSelectionRange(p,p)};
}

/* ============ 總覽 ============ */
function homeHTML(){
  const who=cfg.person;const t=TODAY();
  const rows=sh=>(DB[sh]||[]).filter(r=>!who||r['姓名']===who);
  const water=rows('飲食飲水').filter(r=>r['日期']===t).reduce((a,r)=>a+(Number(r['飲水'])||0),0);
  const medsT=rows('用藥紀錄').filter(r=>r['日期']===t).length;
  const symT=rows('身體狀況').filter(r=>r['日期']===t).length;
  const byDT=(a,b)=>((b['日期']||'')+(b['時間']||'')).localeCompare((a['日期']||'')+(a['時間']||''));
  const lv=rows('身體數值').sort(byDT)[0];
  const ls=rows('身體狀況').sort(byDT).slice(0,5);
  const lc=rows('健檢紀錄').sort((a,b)=>(b['健檢日期']||'').localeCompare(a['健檢日期']||''))[0];
  let h=`<div class="dh" style="margin-top:0">${t} ${wday(t)} · ${who?esc(who):'全部成員'}</div>`;
  h+='<div class="home-grid">'+['vitals','diet','meds','symptoms','visits','checkup'].map(k=>`<button class="qa" data-act="new" data-k="${k}">${ic(SEC[k].i)}${SEC[k].label}</button>`).join('')+'</div>';
  h+=`<div class="stat"><div><b>${water}</b><small>今日飲水 ml</small></div><div><b>${medsT}</b><small>今日用藥</small></div><div><b>${symT}</b><small>今日症狀</small></div></div>`;
  if(lv){const ks=['體重','BMI','收縮壓','舒張壓','脈搏'].filter(k=>lv[k]!==''&&lv[k]!==undefined);
    h+=`<h3>最近一次數值 <small style="color:var(--mut);font-weight:400">${esc(lv['日期'])}${who?'':' · '+esc(lv['姓名'])}</small></h3><div class="card"><div class="kvs">${ks.map(k=>`<span class="kv"><i>${k}</i>${esc(lv[k])}</span>`).join('')||'—'}</div></div>`}
  if(ls.length)h+=`<h3>最近症狀</h3>`+ls.map(r=>`<div class="card"><div class="card-h"><b>${esc(r['日期'])}</b>${!who?`<span class="tag">${esc(r['姓名'])}</span>`:''}${partTag(r)}</div><div class="card-h" style="margin-bottom:0">${symTags(r['症狀'])}${r['其他說明']?`<span class="note" style="margin:0">${esc(r['其他說明'])}</span>`:''}</div></div>`).join('');
  if(lc)h+=`<h3>最近健檢</h3><div class="card"><div class="card-h"><b>${esc(lc['健檢日期'])}</b><span class="tag">${esc(lc['健檢醫院']||'')}</span></div>${lc['異常項目']?`<div class="kv bad">標記異常:${esc(lc['異常項目'])}</div>`:'<div class="note">無標記異常</div>'}</div>`;
  if(!persons().length)h+='<div class="card">第一次使用?先到「設定」新增家人。</div>';
  return h;
}

/* ============ 設定 ============ */
function settingsHTML(){
  let h=`<h3 style="margin-top:0">人員管理</h3>`+(persons().length?(DB['人員']||[]).map(r=>`<div class="pr"><b>${esc(r['姓名'])}</b><span class="tag">${esc(r['性別']||'')} ${esc(r['生日']||'')}</span><button class="btn sec sm" data-act="edit" data-k="people" data-id="${r.id}">修改</button><button class="btn warn sm" data-act="del" data-k="people" data-id="${r.id}">刪除</button></div>`).join(''):'<div class="empty" style="padding:14px">尚未新增人員</div>')+`<button class="btn" data-act="new" data-k="people">＋ 新增人員</button>`;
  h+=`<h3>Google Sheet 連線</h3>`;
  if(SCRIPT_URL)h+=`<div class="note" style="margin-bottom:10px">已連線。每次按「儲存」,資料會自動寫入 Google Sheet。</div><button class="btn sec" data-act="pull">立即同步</button>`;
  else h+=`<div class="fld"><label>Apps Script 網頁應用程式網址</label><input id="cu" value="${esc(cfg.url)}" placeholder="https://script.google.com/macros/s/…/exec"></div><div class="bar" style="margin-top:10px"><button class="btn" data-act="saveurl">儲存並連線</button><button class="btn sec" data-act="pull">立即同步</button></div>`;
  return h;
}

/* ============ 事件 ============ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,k=el.dataset.k,id=el.dataset.id;
  const find=()=>(DB[SEC[k].sheet]||[]).find(r=>r.id===id);
  if(a==='tab'){UI.tab=el.dataset.t;render();window.scrollTo(0,0)}
  else if(a==='new')openForm(k,null,'new');
  else if(a==='edit')openForm(k,find(),'edit');
  else if(a==='copy')openForm(k,find(),'copy');
  else if(a==='del'){if(confirm(k==='people'?'刪除這位成員?(他的紀錄會保留)':'確定刪除這筆紀錄?')){delRow(SEC[k].sheet,id);toast('已刪除');render()}}
  else if(a==='close')closeModal();
  else if(a==='part'){UI.f[UI.tab].part=el.dataset.p;drawList(UI.tab)}
  else if(a==='cmp'){UI.cmp=!UI.cmp;render()}
  else if(a==='sync'){if(!cfg.url){UI.tab='settings';render()}else{lastErr='';await flush();if(!Q.length&&!lastErr)toast('已同步')}}
  else if(a==='saveurl'){cfg.url=$('#cu').value.trim();saveCfg();if(!cfg.url){render();return}if(await pull(true)){toast('連線成功');render()}else{toast('連線失敗:'+(lastErr||'請檢查網址'))}}
  else if(a==='pull')pull(false);
  else if(a==='who'){cfg.person=el.dataset.w;saveCfg();render()}
  else if(a==='rg'){UI.f[UI.tab].rg=el.dataset.v;drawList(UI.tab)}
  else if(a==='mt'){UI.f[UI.tab].m=el.dataset.v;drawList(UI.tab)}
  else if(a==='hc'){const f=UI.f[UI.tab];f.hc=!f.hc;drawList(UI.tab)}
  else if(a==='ckitem'){const f=UI.f.checkup;f.item=(f.item===el.dataset.k)?'':el.dataset.k;drawCompare()}
});
document.addEventListener('input',e=>{
  const f=UI.f[UI.tab];if(!f)return;
  if(e.target.id==='q'){f.q=e.target.value;drawList(UI.tab)}
  else if(e.target.id==='df'){f.from=e.target.value;drawList(UI.tab)}
  else if(e.target.id==='dt'){f.to=e.target.value;drawList(UI.tab)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('online',()=>{lastErr='';flush()});
setInterval(()=>{if(Q.length&&!flushing){lastErr='';flush()}},30000);

render();
if(cfg.url)pull(true);
if(!persons().length&&!cfg.url){UI.tab='settings';render()}
</script>
